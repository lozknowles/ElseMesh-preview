name: Manual experimental preview fallback
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: elsemesh-experimental-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publisher recipe
        uses: actions/checkout@v4
        with:
          path: publisher
          persist-credentials: false
      - name: Check out pinned game source
        uses: actions/checkout@v4
        with:
          repository: lozknowles/ElseMesh
          ref: 70c55a1530258d83f008edaa810ccaa84230341f
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build and stage already reviewed candidate
        working-directory: source
        run: |
          npm ci --ignore-scripts
          npm run build
          node ../publisher/tools/preview/stage-static-preview.mjs
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('artifacts/preview-site/preview-build.json')); if(m.sourceCommit !== '70c55a1530258d83f008edaa810ccaa84230341f' || m.sourceTreeDirty || m.liveFederation) process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/artifacts/preview-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
